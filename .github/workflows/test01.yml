name: Mirror Upstream (Force Except Workflows + Index + Posts + Ads)

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save local files
        run: |
          mkdir -p /tmp/backup

          # Backup workflows
          if [ -d ".github/workflows" ]; then
            cp -r .github/workflows /tmp/backup/
          fi

          # Backup index.html
          if [ -f "index.html" ]; then
            cp index.html /tmp/backup/
          fi

          # Backup _posts
          if [ -d "_posts" ]; then
            cp -r _posts /tmp/backup/
          fi

          # Backup _includes/ads
          if [ -d "_includes/ads" ]; then
            mkdir -p /tmp/backup/_includes
            cp -r _includes/ads /tmp/backup/_includes/
          fi

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/nengmaya538/nengmaya538.github.io.git
          git fetch upstream

      - name: Hard reset to upstream
        run: |
          git reset --hard upstream/master

      - name: Restore excluded files
        run: |
          # Restore workflows
          rm -rf .github/workflows

          if [ -d "/tmp/backup/workflows" ]; then
            mkdir -p .github
            cp -r /tmp/backup/workflows .github/
          fi

          # Restore index.html
          if [ -f "/tmp/backup/index.html" ]; then
            cp /tmp/backup/index.html index.html
          fi

          # Restore _posts
          rm -rf _posts

          if [ -d "/tmp/backup/_posts" ]; then
            cp -r /tmp/backup/_posts _posts
          fi

          # Restore _includes/ads
          rm -rf _includes/ads

          if [ -d "/tmp/backup/_includes/ads" ]; then
            mkdir -p _includes
            cp -r /tmp/backup/_includes/ads _includes/
          fi

      - name: Force push to fork
        run: |
          git add .
          git commit -m "Force sync except workflows, index.html, _posts and _includes/ads" || echo "No changes"
          git push origin master --force
